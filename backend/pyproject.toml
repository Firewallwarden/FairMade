[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmade-backend"
version = "0.40.0"
description = "FairMade backend and Fair Price Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic[email]>=2.10,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "httpx>=0.27,<1",
    "Pillow>=13.0.0,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
